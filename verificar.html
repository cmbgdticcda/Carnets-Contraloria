    <title>CMBG - Verificación Oficial</title>
    <link rel="stylesheet" href="carnet.css">

<body>

    <div class="contenedor">
        <!-- Encabezado Institucional de la Contraloría -->
        <div class="header-institucional">
            <h3>CONTRALORÍA MUNICIPAL</h3>
            <p>Municipio Bolivariano de Guaicaipuro</p>
            <div class="badge-oficial">✓ ÓRGANO DE CONTROL FISCAL</div>
        </div>
        
        <hr class="divisor">

        <!-- Mensajes de estado -->
        <div id="status-message">Verificando autenticidad del funcionario...</div>
        
        <!-- Contenido seguro -->
        <div id="contenido-trabajador" style="display: none;">
            
            <!-- Etiqueta de Estatus que se actualizará dinámicamente -->
            <div id="badge-estatus" class="status-activo">ESTATUS: ACTIVO</div>

            <!-- Foto del Carnet (Busca carnet-XXX.jpg en la carpeta imagenes) -->
            <img id="foto-carnet" src="" alt="Carnet Oficial">
            
            <!-- Reseña del Trabajador -->
            <div class="resena-caja">
                <h4>RESEÑA INSTITUCIONAL</h4>
                <p id="resena-texto">Cargando datos...</p>
            </div>
        </div>
    </div>

            // Puedes seguir agregando los IDs hacia abajo usando la misma estructura...
        };

        // 3. BASE DE DATOS DE RESEÑAS
        const baseDatosTrabajadores = {
        
           
        };

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const id = getQueryParam('id');
        const tokenRecibido = getQueryParam('token');
        const statusElement = document.getElementById('status-message');
        const contenidoDiv = document.getElementById('contenido-trabajador');
        const imgElement = document.getElementById('foto-carnet');
        const resenaElement = document.getElementById('resena-texto');
        const badgeEstatus = document.getElementById('badge-estatus');

        if (id && tokenRecibido) {
            
            const tokenCorrecto = listaTokensValidos[id];

            // VALIDACIÓN DE SEGURIDAD DEL TOKEN
            if (tokenCorrecto && tokenRecibido.trim().toLowerCase() === tokenCorrecto.toLowerCase()) {
                
                // VALIDACIÓN DE ESTATUS (Por defecto si no está anotado asumimos Activo)
                const estatusActual = estatusTrabajadores[id] ? estatusTrabajadores[id] : "Activo";

                if (estatusActual === "Inactivo") {
                    // Si está Inactivo, bloqueamos la visualización y mostramos alerta
                    statusElement.innerHTML = "⚠️ <strong>ATENCIÓN / PERSONAL RETIRADO:</strong><br>El ciudadano portador de esta credencial ya NO LABORA en la Contraloría Municipal de Guaicaipuro.";
                    statusElement.style.color = "#d32f2f";
                    document.body.style.backgroundColor = "#fff3e0"; // Fondo de advertencia naranja suave
                } else {
                    // Si está Activo, procedemos a cargar los datos normalmente
                    const rutaImagen = `imagenes/carnet-${id}.jpg`; 
                    imgElement.src = rutaImagen;

                    imgElement.onload = function() {
                        statusElement.style.display = 'none';
                        contenidoDiv.style.display = 'block';
                        
                        // Configurar el aviso visual de Activo
                        badgeEstatus.innerText = "ESTATUS: ACTIVO";
                        badgeEstatus.className = "status-activo";

                        // Asigna la reseña
                        if (baseDatosTrabajadores[id]) {
                            resenaElement.innerText = baseDatosTrabajadores[id];
                        } else {
                            resenaElement.innerText = "Funcionario activo adscrito a la Contraloría del Municipio Bolivariano de Guaicaipuro (CMBG). Datos validados por la dirección de Gestion humana.";
                        }
                    };

                    imgElement.onerror = function() {
                        statusElement.innerText = "⚠️ ERROR: La foto del carnet (carnet-" + id + ".jpg) no está dentro de la carpeta 'imagenes'.";
                        statusElement.style.color = "#d32f2f";
                    };
                }

            } else {
                statusElement.innerHTML = "🚫 <strong>ALERTA DE SEGURIDAD:</strong><br>Este carnet es INVÁLIDO o ha sido alterado digitalmente.";
                statusElement.style.color = "#d32f2f";
                document.body.style.backgroundColor = "#ffebee";
            }
        } else {
            statusElement.innerText = "⚠️ Acceso denegado. Código de verificación incompleto.";
            statusElement.style.color = "#d32f2f";
        }
    </script>
